[project]
name = "mlops-project"
version = "0.1.0"
description = "Semester MLOps project — your dataset, grown across HW1–HW5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.8.0",
    "pandas>=2.0.0,<3",
    "python-dotenv>=1.0.0",
    "mlflow==3.13.0",
    "dvc[s3]>=3.67.1",
    "joblib>=1.4.0",
    "pyyaml>=6.0",
    "pandera[pandas]>=0.32.1",
    "prefect==3.8.2",
    "fairlearn>=0.14.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
]
lint = [
    "ruff==0.16.1",
]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests with no external dependencies",
    "data: data and data contract tests",
    "eval: model evaluation and release gate tests",
    "integration: integration tests across components",
    "live: requires the Docker Compose stack to be running",
    "dvc: requires a DVC-initialised repo",
]
filterwarnings = [
    "ignore:The behavior of DataFrame concatenation with empty or all-NA entries:FutureWarning:pandera.backends.pandas.error_formatters",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_project"]