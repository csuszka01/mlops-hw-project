# Week 6 Lab — Evaluation pipeline (starter)
#
#   postgres             relational backend store — params, metrics, tags
#   s3                   object store — MLflow's artifacts and DVC's data
#   s3-create-bucket     one-shot job that creates both buckets
#   mlflow               tracking server, between the client and the two stores
#
# Tutorial: https://mlflow.org/docs/latest/ml/tracking/tutorials/remote-server/
# Deviation: the tracking server is containerized rather than run on the host,
# so the whole stack starts with one command.
#
#   cp .env.example .env
#   docker compose up -d --wait    # start, and wait for healthchecks
#   docker compose down            # stop; data persists in the named volumes
#   docker compose down -v         # stop and wipe the volumes
#
# Stop any other lab's stack first — every lab shares the 55xx host ports:
#   cd ../../week-05-data-validation/starter && docker compose down

# A per-lab project name. Without it Compose uses the directory name
# ("starter"), which every lab in this course shares — and so would their
# containers and volumes.
name: mlops-hw-project

services:

  # ── Postgres: relational backend store ─────────────────────────────────────
  # Stores experiment names, run IDs, parameters, metrics, and tags.
  # Image pinned to 16.3 for reproducibility.
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # NEW in Week 8. Prefect keeps its own state -- flow runs, task runs,
      # deployments, schedules -- and it does NOT share MLflow's schema.
      PREFECT_DB: ${PREFECT_DB:-prefectdb}
    ports:
      - "${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the SECOND database on first initialisation of the volume.
      #
      # THE TRAP, and it is worth knowing before it costs you an hour: scripts
      # in docker-entrypoint-initdb.d run ONLY when the data directory is
      # empty. Re-use a volume from an earlier week and this never executes, so
      # the Prefect server starts, fails to find its database, and says nothing
      # about volumes. `make down-v` (or the per-week project name, which gives
      # this week its own volume) is what actually fixes it.
      - ./init-prefect-db.sh:/docker-entrypoint-initdb.d/10-prefect-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Silo: S3-compatible object store ───────────────────────────────────────
  # Silo is a community fork of MinIO (MinIO's own images left Docker Hub in
  # September 2026). It keeps MinIO's MINIO_* variables, `mc` client and console.
  # MLflow artifacts in one bucket, DVC data in the other.
  s3:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT:-5510}:9000"
      - "${S3_CONSOLE_PORT:-5511}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── s3-create-bucket: one-shot bucket initialisation ───────────────────────
  # Runs once after Silo is healthy; --ignore-existing makes it idempotent.
  s3-create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      bash -c "
        mc alias set s3 http://s3:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
        mc mb --ignore-existing s3/${MLFLOW_BUCKET} &&
        mc mb --ignore-existing s3/${DVC_BUCKET}
      "

  # ── MLflow tracking server ──────────────────────────────────────────────────
  # Built from the pinned mlflow.Dockerfile. The client only ever needs
  # MLFLOW_TRACKING_URI; the Silo credentials below stay server-side.
  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    environment:
      # Silo S3 credentials — server-side only, not exposed to the client
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    command:
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${MLFLOW_BUCKET}
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --allowed-hosts
      # The host check does not strip the port, so bare "localhost" would not
      # match "localhost:5500". The "host:*" wildcards accept any port.
      - "localhost,127.0.0.1,mlflow,localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "${MLFLOW_PORT:-5500}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  
  prefect:
    image: prefecthq/prefect:3.8.2-python3.12
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: >-
        postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${PREFECT_DB:-prefectdb}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # ADD this line, the UI uses it to find the API from the browser
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-5520}/api
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "${PREFECT_PORT:-5520}:4200"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
